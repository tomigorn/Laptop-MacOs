# ============================================================================
#  WINDOW SNAP CONFIG  —  edit this file to manage your monitors and layouts.
# ============================================================================
#
# Lives in the repo (window-manager/config/zones.conf), symlinked to
# ~/.config/yabai/zones.conf. Which monitors are connected right now:
# connected.txt next to it (local, refreshed when you open the folder).
#
# There are five kinds of lines (everything else is a comment):
#
#   monitor <uuid> <name> <location>
#       One physical monitor. These are ADDED AUTOMATICALLY the first time the
#       script sees a screen. You edit the <name> and <location> (single words,
#       no spaces). Leave <uuid> alone — it identifies the exact physical screen.
#
#   model <Product-Name> <name> [<location>]
#       Shared desks (new UUID every time): any screen of that model uses
#       <name>'s layout. Product name from the "model" column, spaces as "-".
#       Screens covered by a model rule are not registered.
#
#   layout <name> <size> <size> ...
#       The snap zones for the monitor with that <name>: percentages, LEFT->RIGHT,
#       that add up to 100.   e.g.  50 50  |  40 60  |  20 60 20  |  100
#       "layout default ..." is used for any monitor without its own layout line.
#
#   arrange <location> <top|bottom|center> <name> <name> ...
#       Screen arrangement for a workspace: names left->right separated by
#       spaces, aligned on that edge. Applied on plug in/out when the names are
#       exactly the connected screens.
#
#   bottom <pt>
#       Gap kept free at the bottom of every screen (for the Dock), in points.
#       Fixed, because yabai often misses the Dock. Default 59 (Dock size 39).
#
# To change a size: edit the numbers on a layout line and save. No restart needed.
# ----------------------------------------------------------------------------

# --- Monitors (auto-filled; edit name + location) ---------------------------
#       uuid                                  name                  location
monitor 37D8832A-2D66-02CA-B9F7-8F30A301B230  MacBook               laptop                   # 1470pt

monitor 9EF24336-093D-4B36-8D24-BA95A65D1EEB  ETZ-HP-Ultrawide      Work-01-ETZ-NW-Corridor  # 3440pt, HP-E34m-G4, first seen 2026-06-23
monitor D658B5CF-65AC-4F9B-9B90-4A8247290011  ETZ-Dell              Work-01-ETZ-NW-Corridor  # 2560pt, DELL-U2518D, first seen 2026-10-26

monitor 6CC5643E-3025-4EC6-8997-15FC430C323C  Home-Dell-27          Home                     # 2560pt, first seen 2026-06-19
monitor A88640AF-48DB-4ADB-A066-8F18FF21F660  Home-Dell-22          Home                     # 1920pt, first seen 2026-06-19

# --- Bottom gap for the Dock (points) ---------------------------------------
bottom 59

# --- Layouts (sizes per monitor name) ---------------------------------------
layout MacBook              50 50

layout ETZ-Dell             50 50
layout ETZ-HP-Ultrawide     65 35
layout OCT-HP-Ultrawide     65 35

layout Home-Dell-27         50 50
layout Home-Dell-22         50 50

layout default              50 50

# --- Models (shared desks: any screen of that model) ------------------------
model HP-E34m-G4            OCT-HP-Ultrawide      open-office

# --- Arrangements (screens left -> right per workspace) ----------------------
#       location                 align   names
arrange Work-01-ETZ-NW-Corridor  bottom  ETZ-Dell ETZ-HP-Ultrawide MacBook
